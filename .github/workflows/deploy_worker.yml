name: Deploy HCPSS Worker

on:
  workflow_dispatch:
  push:
    branches: [ main ]

# Serialize deploys: stacked runs (e.g. merging several PRs) each re-register
# Discord slash commands and can rate-limit each other. Superseded pending
# runs are dropped; an in-progress deploy is never cancelled mid-flight.
concurrency:
  group: deploy-worker
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install dependencies
        run: |
          # Pinned exactly so a bad wrangler release can't break deploys at
          # random; Dependabot doesn't cover this, bump deliberately.
          sudo npm install -g wrangler@4.112.0
          sudo apt-get update && sudo apt-get install -y jq

      - name: Lint
        run: |
          cd hcpss-worker
          npm ci --no-audit --no-fund
          npm run lint

      - name: Run worker tests
        run: |
          cd hcpss-worker
          node --test

      - name: Run deploy script
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_CHANNEL_ID: ${{ secrets.DISCORD_CHANNEL_ID }}
          DISCORD_PUBLIC_KEY: ${{ secrets.DISCORD_PUBLIC_KEY }}
          DISCORD_GUILD_ID: ${{ secrets.DISCORD_GUILD_ID }}
          MANUAL_TRIGGER_TOKEN: ${{ secrets.MANUAL_TRIGGER_TOKEN }}
        run: |
          chmod +x ./hcpss-worker/scripts/deploy_worker.sh
          ./hcpss-worker/scripts/deploy_worker.sh

      # Failure alert goes to the bot's log channel as a log line, posted by
      # the bot itself (no webhook, no repo links — the log channel is staff
      # only but logs shouldn't leak URLs regardless). DISCORD_LOG_CHANNEL_ID
      # secret overrides the default from src/constants.js.
      - name: Log failure to Discord
        if: failure()
        env:
          BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          LOG_CHANNEL: ${{ secrets.DISCORD_LOG_CHANNEL_ID }}
        run: |
          CHANNEL="${LOG_CHANNEL:-1524911607942221965}"
          jq -n --arg content "❌ **Worker deploy failed** on main (${GITHUB_SHA::7}) — the bot is still running the previous version. See the Actions tab for details." '{content: $content}' \
            | curl -sS -H "Authorization: Bot ${BOT_TOKEN}" -H "Content-Type: application/json" \
                -d @- "https://discord.com/api/v10/channels/${CHANNEL}/messages" >/dev/null
