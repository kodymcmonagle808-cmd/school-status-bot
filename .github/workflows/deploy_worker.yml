name: Deploy HCPSS Worker

on:
  workflow_dispatch:
  push:
    branches: [ main ]

# Serialize deploys: stacked runs (e.g. merging several PRs) each re-register
# Discord slash commands and can rate-limit each other. Superseded pending
# runs are dropped; an in-progress deploy is never cancelled mid-flight.
concurrency:
  group: deploy-worker
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install dependencies
        run: |
          # Pinned exactly so a bad wrangler release can't break deploys at
          # random; Dependabot doesn't cover this, bump deliberately.
          sudo npm install -g wrangler@4.112.0
          sudo apt-get update && sudo apt-get install -y jq

      - name: Lint
        run: |
          cd hcpss-worker
          npm ci --no-audit --no-fund
          npm run lint

      - name: Run worker tests
        run: |
          cd hcpss-worker
          node --test

      - name: Run deploy script
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_CHANNEL_ID: ${{ secrets.DISCORD_CHANNEL_ID }}
          DISCORD_PUBLIC_KEY: ${{ secrets.DISCORD_PUBLIC_KEY }}
          DISCORD_GUILD_ID: ${{ secrets.DISCORD_GUILD_ID }}
          MANUAL_TRIGGER_TOKEN: ${{ secrets.MANUAL_TRIGGER_TOKEN }}
        run: |
          chmod +x ./hcpss-worker/scripts/deploy_worker.sh
          ./hcpss-worker/scripts/deploy_worker.sh

      # Optional Discord staff-channel alert (DISCORD_OPS_WEBHOOK_URL secret).
      - name: Notify Discord
        if: failure()
        env:
          WEBHOOK: ${{ secrets.DISCORD_OPS_WEBHOOK_URL }}
        run: |
          if [ -z "$WEBHOOK" ]; then echo "DISCORD_OPS_WEBHOOK_URL not set — skipping."; exit 0; fi
          jq -n --arg content "❌ **Worker deploy failed** on main (${GITHUB_SHA::7}) — the bot is still running the previous version.
          ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" '{content: $content}' \
            | curl -sS -H "Content-Type: application/json" -d @- "$WEBHOOK"
