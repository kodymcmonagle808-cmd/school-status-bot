name: Deploy HCPSS Worker

on:
  workflow_dispatch:
  push:
    branches: [ main ]

# Serialize deploys: stacked runs (e.g. merging several PRs) each re-register
# Discord slash commands and can rate-limit each other. Superseded pending
# runs are dropped; an in-progress deploy is never cancelled mid-flight.
concurrency:
  group: deploy-worker
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install dependencies
        run: |
          # Pinned exactly so a bad wrangler release can't break deploys at
          # random; Dependabot doesn't cover this, bump deliberately.
          sudo npm install -g wrangler@4.112.0
          sudo apt-get update && sudo apt-get install -y jq

      - name: Lint
        run: |
          cd hcpss-worker
          npm ci --no-audit --no-fund
          npm run lint

      - name: Run worker tests
        run: |
          cd hcpss-worker
          node --test

      - name: Run deploy script
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_CHANNEL_ID: ${{ secrets.DISCORD_CHANNEL_ID }}
          DISCORD_PUBLIC_KEY: ${{ secrets.DISCORD_PUBLIC_KEY }}
          DISCORD_GUILD_ID: ${{ secrets.DISCORD_GUILD_ID }}
          MANUAL_TRIGGER_TOKEN: ${{ secrets.MANUAL_TRIGGER_TOKEN }}
          OWNER_ID: ${{ secrets.OWNER_ID }}
          NWS_HOOK_SECRET: ${{ secrets.NWS_HOOK_SECRET }}
        run: |
          chmod +x ./hcpss-worker/scripts/deploy_worker.sh
          ./hcpss-worker/scripts/deploy_worker.sh

      # Record this run's outcome in the worker_updates KV key (rolling last
      # 15) so the control panel's owner-only Worker Updates page can list
      # deploy history. Best-effort: never fails the job.
      - name: Record deploy result
        if: always()
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          OUTCOME: ${{ job.status }}
        run: |
          LIST=$(curl -s "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/storage/kv/namespaces?per_page=100" \
            -H "Authorization: Bearer ${CF_API_TOKEN}")
          KV_ID=$(echo "$LIST" | jq -r '.result[]? | select(.title == "hcpss-status-kv") | .id' | head -n 1)
          if [ -z "$KV_ID" ]; then
            KV_ID=$(echo "$LIST" | jq -r '.result // [] | map(select(.title | test("^hcpss-status-kv-[0-9]+$"))) | sort_by(.title) | last | .id // empty')
          fi
          if [ -z "$KV_ID" ]; then echo "KV namespace not found — skipping deploy record."; exit 0; fi
          BASE="https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/storage/kv/namespaces/${KV_ID}/values/worker_updates"
          CURRENT=$(curl -s -H "Authorization: Bearer ${CF_API_TOKEN}" "$BASE")
          echo "$CURRENT" | jq -e 'type == "array"' >/dev/null 2>&1 || CURRENT='[]'
          NEW=$(jq -cn --argjson cur "$CURRENT" --arg sha "${GITHUB_SHA::7}" --arg outcome "$OUTCOME" --arg ts "$(date +%s)" \
            '[{sha: $sha, ok: ($outcome == "success"), ts: (($ts | tonumber) * 1000)}] + $cur | .[0:15]')
          curl -s -X PUT -H "Authorization: Bearer ${CF_API_TOKEN}" -H "Content-Type: application/json" \
            --data "$NEW" "$BASE" >/dev/null
          echo "Recorded deploy result: ${OUTCOME} (${GITHUB_SHA::7})"

      # Failure alert goes to the bot's log channel as a log line, posted by
      # the bot itself (no webhook, no repo links — the log channel is staff
      # only but logs shouldn't leak URLs regardless). DISCORD_LOG_CHANNEL_ID
      # secret overrides the default from src/constants.js.
      - name: Log failure to Discord
        if: failure()
        env:
          BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          LOG_CHANNEL: ${{ secrets.DISCORD_LOG_CHANNEL_ID }}
        run: |
          CHANNEL="${LOG_CHANNEL:-1524911607942221965}"
          jq -n --arg content "❌ **Worker deploy failed** on main (${GITHUB_SHA::7}) — the bot is still running the previous version. See the Actions tab for details." '{content: $content}' \
            | curl -sS -H "Authorization: Bot ${BOT_TOKEN}" -H "Content-Type: application/json" \
                -d @- "https://discord.com/api/v10/channels/${CHANNEL}/messages" >/dev/null
