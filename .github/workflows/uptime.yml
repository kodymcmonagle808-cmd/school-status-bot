name: Worker uptime check

# Polls the live Worker's /health endpoint and fails when the Worker is
# unreachable, unhealthy, or its cron heartbeat is stale — the one failure
# mode nothing else catches: a deployed Worker whose cron silently stopped
# firing.
#
# The schedule below asks for every 20 minutes but does NOT get it: GitHub
# throttles scheduled workflows, and the observed gap between runs is a median
# of 95 minutes (min 59, max 213 over a two-day sample). Real notice of a dead
# cron is therefore 1.5-3.5 hours, dominated by that gap rather than by
# MAX_CRON_AGE_MINUTES. Don't tighten the heartbeat or the limit expecting
# faster detection — the polling interval is the binding constraint, and only
# an external pinger (UptimeRobot, Better Stack) hitting /health would fix it.
#
# The heartbeat is written once per half hour (HEARTBEAT_INTERVAL_MINUTES in
# timeutil.js), so a healthy Worker's tick is never older than ~31 minutes.
# MAX_CRON_AGE_MINUTES has to stay above that with room for one missed tick,
# and both have to move together — raising the write interval without raising
# this limit makes a healthy Worker trip the alarm.
#
# Dedupe via a GitHub issue: the first failure opens "Worker health check
# failing" and pings the log channel; repeat failures stay quiet while the
# issue is open; the first healthy run closes it and posts a recovery line.
#
# Not every red run means the Worker is down. A run that lasts ~15 minutes and
# is annotated "The job was not acquired by Runner of type hosted even after
# multiple attempts" never got a machine: zero steps ran, so nothing probed
# anything and no alert was sent. That is a GitHub capacity failure, not an
# outage — check the run duration before believing the X. Healthy runs finish
# in well under a minute, and nothing here can prevent the acquisition
# failure, so the only response is to ignore it or re-run the job.
#
# The probe itself retries once before failing. A single unreachable /health
# is far more often a transient egress or edge blip than a dead Worker, and
# the alert path is loud (GitHub issue + Discord ping), so one bad sample must
# not be enough to fire it — the same one-missed-tick tolerance already built
# into MAX_CRON_AGE_MINUTES.
#
# The issue bookkeeping is equally untrustworthy and must never be load-
# bearing. Both `gh` steps talk to api.github.com, both assign the result with
# `EXISTING=$(gh issue list ...)`, and under `bash -e` that assignment failing
# kills the step outright. On 2026-08-11 the 23:21 run probed the Worker,
# reported it healthy, and then went red because that lookup hit a transient
# "tls: failed to verify certificate" from GitHub's own API — a red uptime
# check on a Worker that was fine, which is precisely the signal this workflow
# is supposed to reserve for an outage. Every `gh` call here now retries and
# then degrades to a warning, and the recovery step carries
# continue-on-error so bookkeeping can never colour the job.
#
# The two paths degrade in opposite directions on purpose. Recovery is
# cosmetic: if it can't reach the API, stay quiet and let the next healthy run
# close the issue. Alerting is not: if the dedupe lookup can't be resolved,
# post to Discord anyway. A duplicate ping during an outage is cheap; a
# swallowed one is the whole failure this workflow exists to prevent. For the
# same reason the Discord post is the last thing in the step and nothing that
# touches an issue is allowed to abort before it.

on:
  workflow_dispatch:
  schedule:
    - cron: '*/20 * * * *'

permissions:
  contents: read
  issues: write

env:
  HEALTH_URL: https://hcpss-worker.kodymcmonagle808.workers.dev/health
  ISSUE_TITLE: Worker health check failing
  MAX_CRON_AGE_MINUTES: 75

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Probe /health
        id: probe
        timeout-minutes: 5
        run: |
          REASON=""
          for ATTEMPT in 1 2; do
            REASON=""
            set +e
            BODY=$(curl -sS --max-time 20 --retry 2 --retry-delay 5 "$HEALTH_URL")
            CURL_RC=$?
            set -e
            if [ "$CURL_RC" -ne 0 ]; then
              REASON="Worker unreachable (curl exit ${CURL_RC})"
            elif ! echo "$BODY" | jq -e '.ok == true' >/dev/null 2>&1; then
              REASON="Worker responded but not healthy: $(echo "$BODY" | head -c 300)"
            else
              TICK=$(echo "$BODY" | jq -r '.lastCronTickAt // empty')
              if [ -z "$TICK" ]; then
                REASON="No cron heartbeat recorded yet (lastCronTickAt is null)"
              else
                AGE_MIN=$(( ( $(date +%s) - $(date -d "$TICK" +%s) ) / 60 ))
                if [ "$AGE_MIN" -gt "$MAX_CRON_AGE_MINUTES" ]; then
                  REASON="Cron heartbeat is ${AGE_MIN} minutes old (limit ${MAX_CRON_AGE_MINUTES}) — the cron may have stopped firing"
                fi
              fi
            fi
            if [ -z "$REASON" ]; then break; fi
            if [ "$ATTEMPT" -lt 2 ]; then
              echo "Attempt ${ATTEMPT} failed: ${REASON} — retrying in 45s"
              sleep 45
            fi
          done
          echo "reason=$REASON" >> "$GITHUB_OUTPUT"
          if [ -n "$REASON" ]; then
            echo "::error::$REASON"
            exit 1
          fi
          echo "Healthy. gitSha=$(echo "$BODY" | jq -r .gitSha) lastCronTickAt=$(echo "$BODY" | jq -r .lastCronTickAt)"

      # Guarded on the probe's own verdict, not bare failure(): only a probe
      # that actually ran and actually judged the Worker unhealthy may open an
      # issue and ping Discord. Anything else failing the job is a CI problem
      # and must stay off the log channel.
      - name: Alert on first failure
        if: failure() && steps.probe.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          LOG_CHANNEL: ${{ secrets.DISCORD_LOG_CHANNEL_ID }}
          REASON: ${{ steps.probe.outputs.reason }}
        run: |
          find_issue() {
            local found=""
            for i in 1 2 3; do
              if found=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open \
                  --search "in:title \"$ISSUE_TITLE\"" --json number --jq '.[0].number // empty'); then
                printf '%s' "$found"
                return 0
              fi
              echo "Issue lookup attempt ${i} failed." >&2
              sleep $(( i * 5 ))
            done
            return 1
          }

          # A lookup we could not resolve must not silence the alert: fall
          # through to Discord without the issue, and let the next failing run
          # open one once the API is reachable again.
          DEDUPE_KNOWN=1
          if ! EXISTING=$(find_issue); then
            echo "::warning::Could not reach the GitHub API to check for an open issue — alerting anyway."
            EXISTING=""
            DEDUPE_KNOWN=0
          fi
          if [ -n "$EXISTING" ]; then
            echo "Issue #$EXISTING already open — still failing, staying quiet."
            exit 0
          fi
          if [ "$DEDUPE_KNOWN" = "1" ]; then
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$ISSUE_TITLE" \
              --body "The live Worker health check failed: ${REASON:-unknown reason}. This issue auto-closes when the check recovers." \
              || echo "::warning::Could not open the tracking issue — sending the Discord alert regardless."
          fi
          CHANNEL="${LOG_CHANNEL:-1524911607942221965}"
          jq -n --arg content "🚨 **Worker health check failed** — ${REASON:-unknown reason}. Checks run every 20 minutes; you'll get a recovery log when it comes back." '{content: $content}' \
            | curl -sS -H "Authorization: Bot ${BOT_TOKEN}" -H "Content-Type: application/json" \
                -d @- "https://discord.com/api/v10/channels/${CHANNEL}/messages" >/dev/null

      # Bookkeeping only, so continue-on-error: the probe has already declared
      # the Worker healthy by this point and nothing here may overturn that
      # verdict. Without it a bad minute at api.github.com prints an X on a
      # run that proved the Worker up.
      - name: Close issue on recovery
        if: success()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          LOG_CHANNEL: ${{ secrets.DISCORD_LOG_CHANNEL_ID }}
        run: |
          find_issue() {
            local found=""
            for i in 1 2 3; do
              if found=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open \
                  --search "in:title \"$ISSUE_TITLE\"" --json number --jq '.[0].number // empty'); then
                printf '%s' "$found"
                return 0
              fi
              echo "Issue lookup attempt ${i} failed." >&2
              sleep $(( i * 5 ))
            done
            return 1
          }

          # Nothing here is urgent: an unreachable API just means the next
          # healthy run posts the recovery instead of this one.
          if ! EXISTING=$(find_issue); then
            echo "::warning::Could not reach the GitHub API to check for an open issue — leaving recovery to the next run."
            exit 0
          fi
          if [ -z "$EXISTING" ]; then exit 0; fi
          gh issue close "$EXISTING" --repo "$GITHUB_REPOSITORY" --comment "Health check recovered." \
            || echo "::warning::Could not close issue #${EXISTING} — posting the recovery line anyway."
          CHANNEL="${LOG_CHANNEL:-1524911607942221965}"
          jq -n --arg content "✅ **Worker health check recovered** — /health is responding and the cron heartbeat is fresh." '{content: $content}' \
            | curl -sS -H "Authorization: Bot ${BOT_TOKEN}" -H "Content-Type: application/json" \
                -d @- "https://discord.com/api/v10/channels/${CHANNEL}/messages" >/dev/null
