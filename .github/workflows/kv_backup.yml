name: KV backup

# Weekly encrypted export of the Worker's KV namespace (closure history,
# yearly stats, outlook track record, every server's config) as a workflow
# artifact. Requires a KV_BACKUP_PASSPHRASE repository secret — the backup
# contains server configs and opt-in user IDs, so it is never uploaded
# unencrypted.
#
# To restore/inspect a downloaded artifact:
#   openssl enc -d -aes-256-cbc -pbkdf2 -in kv_backup.json.enc -out kv_backup.json
#   (enter the passphrase when prompted)

on:
  workflow_dispatch:
  schedule:
    - cron: '0 8 * * 1' # Mondays, 3/4 AM ET

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Check passphrase secret
        env:
          KV_BACKUP_PASSPHRASE: ${{ secrets.KV_BACKUP_PASSPHRASE }}
        run: |
          if [ -z "$KV_BACKUP_PASSPHRASE" ]; then
            echo "::error::KV_BACKUP_PASSPHRASE secret is not set — refusing to upload an unencrypted backup. Add it in repo Settings → Secrets."
            exit 1
          fi

      - name: Export KV namespace
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          cd hcpss-worker
          node scripts/kv_backup.mjs
          mv kv_backup.json "$GITHUB_WORKSPACE/kv_backup.json"

      - name: Encrypt backup
        env:
          KV_BACKUP_PASSPHRASE: ${{ secrets.KV_BACKUP_PASSPHRASE }}
        run: |
          openssl enc -aes-256-cbc -pbkdf2 -salt \
            -in kv_backup.json -out kv_backup.json.enc \
            -pass env:KV_BACKUP_PASSPHRASE

      # A backup only counts if it restores: decrypt the artifact we are about
      # to upload, confirm it matches the original byte for byte, and check
      # the JSON is sane (entries present, count matches the manifest).
      - name: Verify backup restores
        env:
          KV_BACKUP_PASSPHRASE: ${{ secrets.KV_BACKUP_PASSPHRASE }}
        run: |
          openssl enc -d -aes-256-cbc -pbkdf2 \
            -in kv_backup.json.enc -out kv_backup_verify.json \
            -pass env:KV_BACKUP_PASSPHRASE
          cmp kv_backup.json kv_backup_verify.json
          KEYS=$(jq '.entries | length' kv_backup_verify.json)
          MANIFEST=$(jq '.keyCount' kv_backup_verify.json)
          if [ "$KEYS" -lt 1 ] || [ "$KEYS" != "$MANIFEST" ]; then
            echo "::error::Backup verification failed: entries=$KEYS manifest keyCount=$MANIFEST"
            exit 1
          fi
          echo "Verified: backup decrypts and contains $KEYS keys."
          rm kv_backup.json kv_backup_verify.json

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: kv-backup-${{ github.run_id }}
          path: kv_backup.json.enc
          retention-days: 90

      # Failure alert goes to the bot's log channel as a log line, posted by
      # the bot itself (no webhook, no repo links). DISCORD_LOG_CHANNEL_ID
      # secret overrides the default from src/constants.js.
      - name: Log failure to Discord
        if: failure()
        env:
          BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          LOG_CHANNEL: ${{ secrets.DISCORD_LOG_CHANNEL_ID }}
        run: |
          CHANNEL="${LOG_CHANNEL:-1524911607942221965}"
          jq -n --arg content "❌ **KV backup failed** — this week's export did not run. See the Actions tab for details." '{content: $content}' \
            | curl -sS -H "Authorization: Bot ${BOT_TOKEN}" -H "Content-Type: application/json" \
                -d @- "https://discord.com/api/v10/channels/${CHANNEL}/messages" >/dev/null
