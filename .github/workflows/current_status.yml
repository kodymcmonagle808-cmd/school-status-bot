name: Get Current Status On-Demand

on:
  workflow_dispatch: # This ensures it ONLY runs manually on command

jobs:
  check-now:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4.2.2

    - name: Set up Python
      uses: actions/setup-python@v5.4.0
      with:
        python-version: '3.11'

    - name: Install Dependencies
      run: |
        pip install requests beautifulsoup4

    - name: Run Immediate Status Check
      env:
        DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      run: |
        python - << 'EOF'
        import os
        import requests
        from bs4 import BeautifulSoup

        URL = "https://status.hcpss.org/"
        WEBHOOK_URL = os.getenv("DISCORD_WEBHOOK_URL")

        try:
            response = requests.get(URL, timeout=15)
            response.raise_for_status()
            soup = BeautifulSoup(response.text, 'html.parser')
            
            # Target the parent container enclosing the entire dynamic status content area
            main_block = soup.find(id="block-system-main") or soup.find(class_="region-content")
            
            if main_block:
                # Find all distinct paragraph blocks, headers, or updates listed in the status dashboard
                paragraphs = main_block.find_all(['p', 'h1', 'h2', 'h3', 'div', 'span'])
                
                # Filter out generic site elements and extract unique sentences/announcements
                seen_lines = set()
                extracted_lines = []
                
                for element in paragraphs:
                    text = element.get_text().strip()
                    # Keep paragraphs that contain letters/numbers, and filter generic nav items out
                    if text and len(text) > 5 and text not in seen_lines:
                        if not any(nav in text.lower() for nav in ["skip to main", "main menu", "languages"]):
                            # Compress any weird internal white spaces
                            clean_line = " ".join(text.split())
                            # Basic duplication screening for layered HTML trees
                            if not any(clean_line in existing for existing in extracted_lines):
                                extracted_lines.append(clean_line)
                                seen_lines.add(text)
                
                # Combine distinct status nodes using standard code dividers
                if extracted_lines:
                    # Capture up to 5 unique stacked status blocks to protect layout length limits
                    status_text = "\n\n• ".join(extracted_lines[:5])
                else:
                    status_text = "Normal Operations (No Active Alerts)"
            else:
                status_text = "Normal Operations"

            # Truncate slightly if structural metadata grows too massive
            if len(status_text) > 1500:
                status_text = status_text[:1450] + "..."
            
            # Formulate layout container
            payload = {
                "content": f"ℹ️ **HCPSS Comprehensive On-Demand Status Report**\n\n• {status_text}\n\n🔗 Source Verification: {URL}"
            }
            
            if WEBHOOK_URL:
                requests.post(WEBHOOK_URL, json=payload)
                print("Successfully dispatched complete text dump snapshot layout.")
            else:
                print("Missing target Webhook configuration endpoint.")
                
        except Exception as e:
            print(f"Pipeline error: {e}")
        EOF
