name: Get Current Status On-Demand

on:
  workflow_dispatch:

concurrency:
    group: hcpss-status-monitor-discord
    cancel-in-progress: true

jobs:
  check-now:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4.2.2

    - name: Set up Python
      uses: actions/setup-python@v5.4.0
      with:
        python-version: '3.11'

    - name: Install Dependencies
      run: |
        pip install requests beautifulsoup4 pytz

    - name: Run Immediate Status Check
      env:
        DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      run: |
        python - << 'EOF'
        import os
        import json
        import requests
        from bs4 import BeautifulSoup
        from datetime import datetime
        import pytz
        from urllib.parse import parse_qsl, urlencode, urlsplit

        URL = "https://hcpss.org"
        ONDEMAND_STATE_FILE = "last_message_state.json"
        LEGACY_ONDEMAND_STATE_FILE = "last_ondemand_message_state.json"
        LEGACY_ONDEMAND_MSG_FILE = "last_ondemand_message_id.txt"
        LEGACY_SHARED_MSG_FILE = "last_message_id.txt"
        WEBHOOK_URL = os.getenv("DISCORD_WEBHOOK_URL")

        def webhook_base_and_query():
            if not WEBHOOK_URL:
                print("[DEBUG] WEBHOOK_URL environment variable is EMPTY!")
                return "", ""

            parsed = urlsplit(WEBHOOK_URL)
            clean_url = f"{parsed.scheme}://{parsed.netloc}{parsed.path}"
            passthrough = [(k, v) for k, v in parse_qsl(parsed.query, keep_blank_values=True) if k.lower() != "wait"]
            query = urlencode(passthrough)
            print(f"[DEBUG] Raw Webhook URL: {WEBHOOK_URL[:30]}...")
            print(f"[DEBUG] Cleaned Base Webhook URL: {clean_url[:30]}...")
            return clean_url, query

        def build_post_url():
            base_url, query = webhook_base_and_query()
            if not base_url:
                return ""

            params = parse_qsl(query, keep_blank_values=True) if query else []
            params = [(k, v) for k, v in params if k.lower() != "wait"]
            params.append(("wait", "true"))
            return f"{base_url}?{urlencode(params)}"

        def build_delete_url(msg_id):
            base_url, query = webhook_base_and_query()
            if not base_url or not msg_id:
                return ""

            delete_url = f"{base_url}/messages/{msg_id}"
            if query:
                return f"{delete_url}?{query}"
            return delete_url

        def delete_old_message(msg_id):
            delete_url = build_delete_url(msg_id)
            if not delete_url:
                print(f"[DEBUG] Skinned deletion execution. delete_url present: {bool(delete_url)}, msg_id: {msg_id}")
                return
            try:
                print(f"[DEBUG] Sending HTTP DELETE request to target URL: {delete_url}")
                response = requests.delete(delete_url, timeout=10)
                print(f"[DEBUG] Discord Response Status Code: {response.status_code}")
                print(f"[DEBUG] Discord Response Content: {response.text}")
                
                if response.status_code == 204 or response.status_code == 404:
                    print(f"[SUCCESS] Old on-demand message handled (ID: {msg_id}).")
                else:
                    print(f"[WARNING] Discord rejected deletion call. Check webhook channel management permissions.")
            except Exception as e:
                print(f"[ERROR] Exception occurred during deletion execution: {e}")

        def load_ondemand_state():
            if os.path.exists(ONDEMAND_STATE_FILE):
                try:
                    with open(ONDEMAND_STATE_FILE, "r", encoding="utf-8") as f:
                        data = json.load(f)
                        if isinstance(data, dict):
                            return data
                except Exception as e:
                    print(f"[WARNING] Could not parse on-demand state file: {e}")

            if os.path.exists(LEGACY_ONDEMAND_STATE_FILE):
                try:
                    with open(LEGACY_ONDEMAND_STATE_FILE, "r", encoding="utf-8") as f:
                        data = json.load(f)
                        if isinstance(data, dict):
                            return data
                except Exception as e:
                    print(f"[WARNING] Could not parse legacy on-demand state file: {e}")

            if os.path.exists(LEGACY_ONDEMAND_MSG_FILE):
                try:
                    with open(LEGACY_ONDEMAND_MSG_FILE, "r", encoding="utf-8") as f:
                        old_msg_id = f.read().strip()
                        if old_msg_id:
                            return {"last_message_id": old_msg_id}
                except Exception as e:
                    print(f"[WARNING] Could not parse legacy on-demand message file: {e}")

            if os.path.exists(LEGACY_SHARED_MSG_FILE):
                try:
                    with open(LEGACY_SHARED_MSG_FILE, "r", encoding="utf-8") as f:
                        old_raw = f.read().strip()
                        old_msg_id = old_raw.split(",")[0] if "," in old_raw else old_raw
                        if old_msg_id:
                            return {"last_message_id": old_msg_id}
                except Exception as e:
                    print(f"[WARNING] Could not parse legacy shared message file: {e}")

            return {}

        def save_ondemand_state(state):
            try:
                with open(ONDEMAND_STATE_FILE, "w", encoding="utf-8") as f:
                    json.dump(state, f)
            except Exception as e:
                print(f"[WARNING] Could not save on-demand state file: {e}")

        try:
            eastern_tz = pytz.timezone('America/New_York')
            now_local = datetime.now(eastern_tz)

            print(f"[DEBUG] Local execution timestamp established: {now_local}")
            response = requests.get(URL, timeout=15)
            response.raise_for_status()
            soup = BeautifulSoup(response.text, 'html.parser')
            
            status_cards = soup.find_all(class_="views-row")
            print(f"[DEBUG] Total webpage status views-row cards matched: {len(status_cards)}")
            
            extracted_blocks = []
            is_normal = True

            if status_cards:
                for card in status_cards:
                    date_el = card.find(class_="views-field-changed") or card.find('h3') or card.find(class_="field-name-post-date")
                    title_el = card.find(class_="status-header") or card.find('h2') or card.find('h1')
                    body_el = card.find(class_="alert-content") or card.find('p')
                    
                    date_text = " ".join(date_el.get_text().split()) if date_el else ""
                    status_title = " ".join(title_el.get_text().split()) if title_el else ""
                    body_text = " ".join(body_el.get_text().split()) if body_el else ""
                    
                    if "view hcpss calendar" in body_text.lower():
                        body_text = body_text.lower().replace("view hcpss calendar", "").strip()

                    if status_title and "normal operations" not in status_title.lower():
                        is_normal = False

                    card_markdown = ""
                    if status_title:
                        card_markdown += f"## **{status_title}**\n\n"
                    if body_text:
                        card_markdown += f"{body_text}\n"
                    
                    if card_markdown:
                        extracted_blocks.append((date_text, card_markdown))
            
            if not extracted_blocks:
                extracted_blocks.append((now_local.strftime('%B %d, %Y'), "## **Normal Operations**\n\nStaff and students report in accordance with the HCPSS calendar."))

            ondemand_state = load_ondemand_state()
            old_msg_id = ondemand_state.get("last_message_id")
            if old_msg_id:
                print(f"[DEBUG] Found existing tracker message ID value: '{old_msg_id}'")
            else:
                print("[DEBUG] No previous on-demand message ID discovered in state files.")

            primary_date = extracted_blocks[0][0] if extracted_blocks else now_local.strftime('%B %d, %Y')
            final_description = "\n___\n\n".join([block[1] for block in extracted_blocks])
            embed_color = 3066993 if is_normal else 15158332
            
            payload = {
                "embeds": [
                    {
                        "title": f"🗓️ Status for {primary_date}",
                        "url": URL,
                        "color": embed_color,
                        "description": final_description,
                        "footer": {
                            "text": "HCPSS On-Demand Status Check Request"
                        },
                        "timestamp": datetime.utcnow().isoformat() + "Z"
                    }
                ]
            }
            
            url_with_wait = build_post_url()
            if url_with_wait:
                print(f"[DEBUG] Posting fresh payload to Discord endpoint with query waiting tags activated...")
                res = requests.post(url_with_wait, json=payload, timeout=12)
                print(f"[DEBUG] Discord Post Response Status: {res.status_code}")
                
                if res.status_code == 200 or res.status_code == 201:
                    new_msg_id = res.json().get("id")
                    print(f"[DEBUG] Isolated new delivery message reference hash id: {new_msg_id}")
                    if new_msg_id:
                        save_ondemand_state({"last_message_id": new_msg_id})
                        print(f"[SUCCESS] Saved message ID '{new_msg_id}' in on-demand state file.")
                        if old_msg_id and old_msg_id != new_msg_id:
                            delete_old_message(old_msg_id)
                    else:
                        print("[WARNING] Post succeeded but no message ID was returned. Existing state was not changed.")
                else:
                    print(f"[ERROR] Post payload verification failed on server: {res.text}")
            else:
                print("[ERROR] Webhook clean target address parsing returned empty string parameters.")
                
        except Exception as e:
            print(f"[CRITICAL FAILURE] Master try loop processing fault isolated: {e}")
        EOF
        
    - name: Commit and Push Trackers
      run: |
        git config --global user.name "GitHub Actions Bot"
        git config --global user.email "actions@github.com"
                for f in last_message_state.json last_ondemand_message_state.json last_ondemand_message_id.txt last_message_id.txt; do
                    if [ -f "$f" ]; then
                        git add "$f"
                    fi
                done

                if git diff --cached --quiet; then
                    echo "No tracker changes to commit."
                    exit 0
                fi

                git commit -m "Update on-demand tracking cache [Diagnostic Run]"

                for attempt in 1 2 3; do
                    if git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}"; then
                        echo "Tracker state pushed successfully."
                        exit 0
                    fi
                    echo "Push attempt ${attempt} failed; retrying..."
                done

                echo "Failed to push tracker state after 3 attempts."
                exit 1
