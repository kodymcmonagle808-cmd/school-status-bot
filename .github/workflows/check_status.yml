name: Check HCPSS Status

on:
  schedule:
    # Check at 5:20 AM, 7:20 AM, 10:00 AM, and 8:00 PM Eastern (EDT: UTC-4, EST: UTC-5)
    - cron: '20 9,10 * * *'
    - cron: '20 11,12 * * *'
    - cron: '0 14,15 * * *'
    - cron: '0 0,1 * * *'
  workflow_dispatch:

concurrency:
  group: hcpss-status-monitor-worker
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Worker status post
        env:
          WORKER_URL: https://hcpss-worker.kodymcmonagle808.workers.dev
          MANUAL_TRIGGER_TOKEN: ${{ secrets.MANUAL_TRIGGER_TOKEN }}
        run: |
          if [ -z "$MANUAL_TRIGGER_TOKEN" ]; then
            echo "MANUAL_TRIGGER_TOKEN is missing. Add it as a GitHub Actions secret, then rerun this workflow."
            exit 1
          fi

          curl --fail-with-body \
            --request POST \
            --header "Authorization: Bearer ${MANUAL_TRIGGER_TOKEN}" \
            "$WORKER_URL"
