name: Check HCPSS Status

on:
  schedule:
    - cron: '*/15 * * * *' # Runs every 15 minutes automatically
  workflow_dispatch: # Allows you to manually trigger it for testing

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Allows the script to remember the previous status state

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-python: '3.x'

    - name: Install Dependencies
      run: |
        pip install requests beautifulsoup4

    - name: Run Monitor Script
      env:
        DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      run: python monitor.py

    - name: Commit and Push Status Changes
      run: |
        git config --global user.name "GitHub Actions Bot"
        git config --global user.email "actions@github.com"
        git add last_status.txt || true
        git commit -m "Update last known status snapshot" || true
        git push || true
