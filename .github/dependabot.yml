version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /hcpss-worker
    schedule:
      interval: weekly
    # One combined PR so peer-coupled packages (eslint + @eslint/js) can't
    # arrive as separate PRs where one fails npm ci on a peer-dep conflict.
    groups:
      npm-deps:
        patterns:
          - "*"
