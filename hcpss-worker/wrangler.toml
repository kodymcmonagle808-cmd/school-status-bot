name = "hcpss-worker"
main = "src/index.js"
compatibility_date = "2026-07-09"
compatibility_flags = ["nodejs_compat"]

# Workers Logs is where every action the Worker takes is recorded (the ACT|
# lines from src/actionlog.js). It costs nothing — unlike KV — and it is
# readable over the Cloudflare API, which is what showLogs() in
# gas/nws-alert-watcher.js queries. Nothing is mirrored into Discord — the
# control panel is the only in-server log — so this is the complete stream,
# and it has to keep working when the Worker itself is broken. It stays on
# deliberately: turning it off blinds the only view of what the Worker did.
[observability]
enabled = true
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
# The cron fires every minute, so per-invocation summary lines would be ~1,440
# entries a day of "a scheduled event ran" — enough to push the actual actions
# out of any recent-events query long before they stop being interesting.
# Uncaught exceptions are still recorded on their own; everything the Worker
# does on purpose is logged explicitly through logAction().
invocation_logs = false

[observability.traces]
enabled = false
persist = true
head_sampling_rate = 1

[vars]
GIT_SHA = ""
DISCORD_APPLICATION_ID = "1524455676225785958"
DISCORD_PUBLIC_KEY = "a720037cc985ff440f41cf7033bc953ce8f6fe60a3c4947d298cb63464b2e539"
DISCORD_GUILD_ID = ""
# Same id as the STATUS_KV binding below, as a plain var so the Worker can
# query Cloudflare's KV analytics for the owner Worker Updates usage gauge.
KV_NAMESPACE_ID = "f0ecd441d95a4cbca41035b619a94705"
# Where this Worker answers, used to build the absolute System Logs link the
# control panel hands out (`GET /logs`). Interactions arrive over Discord's
# webhook, not this hostname, so it can't be inferred at click time. If the
# Worker moves to a custom domain, change it here — a wrong value produces a
# dead link, and an empty one makes the panel say the page isn't configured.
PUBLIC_BASE_URL = "https://hcpss-worker.kodymcmonagle808.workers.dev"

[[kv_namespaces]]
binding = "STATUS_KV"
id = "f0ecd441d95a4cbca41035b619a94705"

# Cron fires every minute; the worker matches each guild's configured check
# times (Eastern, any minute of the day) and dedupes so each slot runs once.
[triggers]
crons = ["* * * * *"]