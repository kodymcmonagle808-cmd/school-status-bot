name = "hcpss-worker"
main = "src/index.js"
compatibility_date = "2026-07-09"

[observability]
enabled = false
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = false
persist = true
head_sampling_rate = 1

[vars]
DISCORD_APPLICATION_ID = "1524455676225785958"
DISCORD_PUBLIC_KEY = "a720037cc985ff440f41cf7033bc953ce8f6fe60a3c4947d298cb63464b2e539"
DISCORD_GUILD_ID = ""

[[kv_namespaces]]
binding = "STATUS_KV"
id = "PASTE_YOUR_KV_ID_HERE"

# Cron trigger: check at 5:20 AM, 7:20 AM, 10:00 AM, and 8:00 PM Eastern (EDT: UTC-4, EST: UTC-5)
[triggers]
crons = [
  "20 9,10 * * *",   # 5:20 AM EDT/EST
  "20 11,12 * * *",  # 7:20 AM EDT/EST
  "0 14,15 * * *",   # 10:00 AM EDT/EST
  "0 0,1 * * *"      # 8:00 PM EDT/EST
]