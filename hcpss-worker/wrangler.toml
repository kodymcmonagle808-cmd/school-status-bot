name = "hcpss-worker"
main = "src/index.js"
compatibility_date = "2026-07-09"

[vars]
DISCORD_APPLICATION_ID = "1524455676225785958"
DISCORD_PUBLIC_KEY = "a720037cc985ff440f41cf7033bc953ce8f6fe60a3c4947d298cb63464b2e539"
DISCORD_GUILD_ID = ""

[[kv_namespaces]]
binding = "STATUS_KV"
id = "PASTE_YOUR_KV_ID_HERE"

# Cron trigger: cover all 25 potential local times, optimized for EDT and EST
[triggers]
crons = [
  "0 * * * *",       # Hourly checks (all :00 times)
  "20 9-12 * * *",   # 5:20 AM and 7:20 AM checks (EDT/EST)
  "30 10-14 * * *"   # Half-hourly checks between 6:30 AM and 9:30 AM (EDT/EST)
]
