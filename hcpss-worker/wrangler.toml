# Cron trigger: check at 5:20 AM, 7:20 AM, 10:00 AM, and 8:00 PM Eastern (EDT: UTC-4, EST: UTC-5)
[triggers]
crons = [
  "20 9 * * *",   # 5:20 AM EDT
  "20 10 * * *",  # 5:20 AM EST
  "20 11 * * *",  # 7:20 AM EDT
  "20 12 * * *",  # 7:20 AM EST
  "0 14 * * *",   # 10:00 AM EDT
  "0 15 * * *",   # 10:00 AM EST
  "0 0 * * *",    # 8:00 PM EDT
  "0 1 * * *"     # 8:00 PM EST
]
